name: Sync TDCC Weekly Snapshot

on:
  schedule:
    # Every Saturday at 00:30 UTC (08:30 Taiwan time, after Friday night TDCC release)
    - cron: "30 0 * * 6"
  workflow_dispatch:

jobs:
  sync:
    name: Build & Upload TDCC Snapshot (asia-east1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Keyless WIF OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run TDCC Sync in Taiwan (asia-east1)
        run: |
          gcloud builds submit . \
            --region=asia-east1 \
            --project=stockv-linebot \
            --config=scripts/cloudbuild-sync-tdcc.yaml \
            --quiet
